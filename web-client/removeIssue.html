<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Remove Issue</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="commentScripts.js"></script>
    <script src="issueScripts.js"></script>
    <script src="searchScripts.js"></script>
    <script src="userScripts.js"></script>
    <style>
      .comment {
        display: flex;
        flex-direction: column;
        gap: 4px;
        border: 1px solid #ccc;
        padding: 10px;
        border-radius: 6px;
        margin: 8px 0;
        background: #f7f7f7;
        width: 400px;
      }

      .comment-header {
        display: flex;
        justify-content: space-between;
        font-size: 14px;
        color: gray;
      }
      .comment-text {
        font-size: 15px;
      }
    </style>
  </head>

  <body>
    <h1>Edit Issue</h1>
    <fieldset>
      <!-- TODO: Modify these to be inputs and format properly, with starting values of the Issue called -->
      <!-- This is just a basic Issue Layout Template -->
      <h3 id="issue">#1 [Issue Title]</h3>
      <span id="priority">Priority: [Priority]</span>
      <span id="status">Status: [Status]</span>
      <span id="user">Assigned To: [User]</span>
      <h4>Description</h4>
      <p id="description">[1st comment]</p>
      <h4>Comments</h4>
      <p id="comments">[Rest of the Comments]</p>

      <h3>Remove Comment</h3>
      <textarea id="commentId"></textarea><br />
      <button onclick="deleteComment(0)">Add Comment</button>
      <p id="addResult"></p>
      <br />
    </fieldset>
  </body>
</html>
