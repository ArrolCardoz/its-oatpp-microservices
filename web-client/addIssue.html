<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Issue Details - Issue Tracking System</title>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="styles.css" />

    <script src="commentScripts.js"></script>
    <script src="issueScripts.js"></script>
    <script src="searchScripts.js"></script>
    <script src="userScripts.js"></script>
  </head>

  <body class="bg-light py-5">
    <div class="container">
      <div class="mb-4">
        <a
          href="../ITS-Client.html"
          class="text-decoration-none text-secondary small fw-semibold"
        >
          ← Back to Home
        </a>
      </div>

      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="card shadow-sm border-0 rounded-3 mb-4">
            <div class="card-body p-4">
              <h1 class="h3 fw-bold text-dark mb-3" id="issue">
                #1 [Issue Title]
              </h1>

              <div
                class="d-flex flex-wrap gap-2 align-items-center border-bottom pb-3 mb-4"
              >
                <span
                  class="badge bg-danger rounded-pill px-3 py-2 fs-7"
                  id="priority"
                  >Priority: [Priority]</span
                >
                <span
                  class="badge bg-warning text-dark rounded-pill px-3 py-2 fs-7"
                  id="status"
                  >Status: [Status]</span
                >
                <span
                  class="badge bg-secondary rounded-pill px-3 py-2 fs-7"
                  id="user"
                  >Assigned To: [User]</span
                >
              </div>

              <div class="mb-4">
                <h4 class="h6 text-uppercase fw-bold text-secondary mb-2">
                  Description
                </h4>
                <div
                  class="p-3 bg-white border rounded-3 text-dark"
                  id="description"
                >
                  [1st comment]
                </div>
              </div>

              <div class="mb-2">
                <h4 class="h6 text-uppercase fw-bold text-secondary mb-2">
                  Comments Activity
                </h4>
                <div
                  class="p-3 bg-light border border-dashed rounded-3 text-muted min-vh-10"
                  id="comments"
                >
                  [Rest of the Comments]
                </div>
              </div>
            </div>
          </div>
          <div class="card shadow-sm border-0 rounded-3">
            <div class="card-body p-4">
              <h3 class="h5 fw-bold text-dark mb-3">Add Comment</h3>

              <div class="mb-3">
                <label
                  for="comment"
                  class="form-label small fw-semibold text-secondary"
                  >Your Message</label
                >
                <textarea
                  class="form-control"
                  id="comment"
                  rows="4"
                  placeholder="Type your update or resolution notes here..."
                ></textarea>
              </div>

              <div class="d-flex align-items-center justify-content-between">
                <button
                  class="btn btn-primary fw-semibold px-4"
                  onclick="addCommentsByIssue(0)"
                >
                  Add Comment
                </button>
                <p class="small mb-0 fw-medium text-success" id="addResult"></p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
